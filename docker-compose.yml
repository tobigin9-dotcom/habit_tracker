services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-habits}
      POSTGRES_USER: ${POSTGRES_USER:-habits_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-habits_user} -d ${POSTGRES_DB:-habits}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    command: ["python", "-m", "bot.main"]
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  reminders:
    build: .
    env_file: .env
    command: ["python", "-m", "app.reminders"]
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
